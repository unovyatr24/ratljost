name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout private repo
        uses: actions/checkout@v4
        with:
          repository: unovyatr24/mokita
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 1

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: run monitor
        run: python monitor_core.py

      - name: log stats
        run: python stats_logger.py
