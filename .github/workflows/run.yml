name: trigger-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: trigger private repo
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.TRIGGER_TOKEN }}" \
          https://api.github.com/repos/YOUR_USERNAME/YOUR_PRIVATE_REPO/dispatches \
          -d '{"event_type":"run-monitor"}'
